name: M9 layer schema worker
on:
  push:
    branches: ['work/m9-layer-schema']
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore full baseline manifest ratchet
        run: git show 41ca9f408fee419b53a853f8bac97f3cfe320b88:tests/veyra-manifest.test.mjs > tests/veyra-manifest.test.mjs
      - name: Prepare robust M9 base patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-m9-layer-schema.py')
          t=p.read_text()
          start=t.index('# Artboard duplication')
          end=t.index("index=ROOT/'src/index.js'")
          p.write_text(t[:start]+t[end:])
          PY
      - name: Apply M9 layered schema patches
        run: |
          python3 scripts/apply-m9-layer-schema.py
          python3 scripts/apply-m9-layer-followup.py
      - name: Syntax check
        run: npm run check
      - name: Full repository suites with retained failure evidence
        run: |
          set +e
          npm test > /tmp/m9-layer-test.log 2>&1
          status=$?
          cat /tmp/m9-layer-test.log
          if [ "$status" -ne 0 ]; then
            mkdir -p verification
            cp /tmp/m9-layer-test.log verification/m9-layer-worker-failure.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add verification/m9-layer-worker-failure.log
            git commit -m 'test(m9): retain layered schema failure evidence'
            git push origin HEAD:work/m9-layer-schema
            exit "$status"
          fi
      - name: Remove worker-only patch machinery
        run: rm -f scripts/apply-m9-layer-schema.py scripts/apply-m9-layer-followup.py .github/workflows/m9-layer-worker.yml verification/m9-layer-worker-failure.log
      - name: Diff hygiene
        run: git diff --check
      - name: Commit clean M9 layer foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(m9): add layered machine schema and legacy migration'
          git push origin HEAD:work/m9-layer-schema
