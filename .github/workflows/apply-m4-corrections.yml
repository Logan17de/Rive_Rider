name: Apply M4 Corrections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-m4-corrections.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused correction integration
        run: python3 scripts/apply-m4-correction-integration.py
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Commit clean correction implementation
        run: |
          rm scripts/apply-m4-correction-integration.py
          rm .github/workflows/apply-m4-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement M4 interaction correctness corrections [m4-corrected]'
          git push
