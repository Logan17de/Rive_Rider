name: M8 Integrate Main

on:
  push:
    branches: [m8-data-binding]
    paths: ['.github/workflows/m8-integrate-main.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8-data-binding
          fetch-depth: 0
      - name: Preserve verified M8 staging artifacts
        run: |
          mkdir -p /tmp/m8/scripts /tmp/m8/src/veyra
          cp scripts/apply-m8-*.py /tmp/m8/scripts/
          cp src/veyra/dataGraph.js /tmp/m8/src/veyra/dataGraph.js
          cp src/veyra/dataStore.js /tmp/m8/src/veyra/dataStore.js
      - name: Checkout exact live M8 base
        run: |
          git fetch origin main
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "b7eb4612549dc6f46c66e322c117532be2fb7018"
      - name: Materialize M8 production implementation
        run: |
          cp /tmp/m8/src/veyra/dataGraph.js src/veyra/dataGraph.js
          cp /tmp/m8/src/veyra/dataStore.js src/veyra/dataStore.js
          cp /tmp/m8/scripts/apply-m8-*.py scripts/
          python scripts/apply-m8-core.py
          python scripts/apply-m8-runtime-fixes.py
          python scripts/apply-m8-control.py
          python scripts/apply-m8-shell.py
          python scripts/apply-m8-contract-completion.py
          python scripts/apply-m8-ui-completion.py
          python scripts/apply-m8-project-lifecycle.py
          python scripts/apply-m8-tests.py
          python scripts/apply-m8-test-fixes.py
          python scripts/apply-m8-final-test-fix.py
          rm -f scripts/apply-m8-*.py
      - name: Verify no temporary staging machinery is entering main
        run: |
          test ! -e .github/workflows/m8-staging-gate.yml
          test ! -e .github/workflows/m8-integrate-main.yml
          test -z "$(git status --short | grep 'scripts/apply-m8-' || true)"
      - name: Syntax gate
        run: npm run check
      - name: Full test gate
        run: npm test
      - name: Commit M8 implementation
        run: |
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add src tests veyra.js
          git status --short
          git commit -m "Implement M8 View Models and data binding [m8]"
          git push origin HEAD:main
