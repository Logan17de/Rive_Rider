name: M9 blend states worker
on:
  push:
    branches: ['work/m9-blend-states']
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply blend state patch
        run: python3 scripts/apply-m9-blend-states.py
      - name: Syntax checks
        run: npm run check
      - name: Full repository suites with retained failure evidence
        run: |
          set +e
          npm test > /tmp/m9-blend.log 2>&1
          status=$?
          cat /tmp/m9-blend.log
          if [ "$status" -ne 0 ]; then
            mkdir -p verification
            cp /tmp/m9-blend.log verification/m9-blend-states-failure.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add verification/m9-blend-states-failure.log
            git commit -m 'test(m9): retain blend state failure evidence'
            git push origin HEAD:work/m9-blend-states
            exit "$status"
          fi
      - name: Remove worker-only transport
        run: rm -f scripts/apply-m9-blend-states.py .github/workflows/m9-blend-states-worker.yml verification/m9-blend-states-failure.log
      - name: Diff hygiene
        run: git diff --check
      - name: Commit clean blend slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(m9): add 1D and direct blend state evaluation'
          git push origin HEAD:work/m9-blend-states
