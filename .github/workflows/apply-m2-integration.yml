name: Apply M2 Resolver Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-m2-integration.yml'
      - 'scripts/apply-m2-integration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[m2-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply M2 integration
        run: python3 scripts/apply-m2-integration.py
      - name: Run checks
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veyra/manifest.js src/index.js veyra.js
          git diff --cached --check
          git commit -m "Integrate M2 resolver read surfaces [m2-integrated]"
          git push origin HEAD:main
