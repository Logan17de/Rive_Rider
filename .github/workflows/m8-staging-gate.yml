name: M8 Staging Gate

on:
  push:
    branches: [m8-data-binding]
    paths:
      - 'src/veyra/dataGraph.js'
      - 'src/veyra/dataStore.js'
      - 'scripts/apply-m8-*.py'
      - '.github/workflows/m8-staging-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply M8 core patch
        run: python scripts/apply-m8-core.py
      - name: Apply M8 runtime fixes
        run: python scripts/apply-m8-runtime-fixes.py
      - name: Apply M8 control patch
        run: python scripts/apply-m8-control.py
      - name: Apply M8 shell patch
        run: python scripts/apply-m8-shell.py
      - name: Apply M8 stable enum reorder contract
        run: python scripts/apply-m8-contract-completion.py
      - name: Apply M8 bounded human authoring completion
        run: python scripts/apply-m8-ui-completion.py
      - name: Apply M8 artboard lifecycle completion
        run: python scripts/apply-m8-project-lifecycle.py
      - name: Apply M8 tests
        run: python scripts/apply-m8-tests.py
      - name: Apply M8 additive test fixes
        run: python scripts/apply-m8-test-fixes.py
      - name: Apply M8 final manifest gate fix
        run: python scripts/apply-m8-final-test-fix.py
      - name: Diagnose M8 assertion context
        run: nl -ba tests/veyra-m8-data-binding.test.mjs | sed -n '188,202p'
      - name: Syntax gate
        run: npm run check
      - name: Full test gate
        run: npm test
