name: M8 independent verifier

on:
  push:
    branches: ['verify/m8-c2-216deb8c']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm production baseline is unchanged
        run: |
          git diff --exit-code 216deb8c972cf476c3c9c0de90d640e47520568f HEAD -- src veyra.js veyra.html veyra.css scripts tests package.json package-lock.json
          git archive --format=zip HEAD -o review-source.zip
      - run: npm ci
      - name: Baseline syntax and full suites
        run: npm run check && npm test
      - name: Independent contract probes
        run: node verification/m8-c2-review.mjs
      - name: Preserve reproducible review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m8-independent-review-evidence
          path: |
            review-source.zip
            verification/m8-c2-review-results.json
          retention-days: 7
