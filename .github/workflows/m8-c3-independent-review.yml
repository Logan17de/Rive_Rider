name: M8 C3 independent baseline review
on:
  push:
    branches: ['verify/m8-c3-d36f0ac']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm unchanged production baseline
        run: git diff --exit-code d36f0ac2841fa6320f4335f617847d123dd394ca HEAD -- src veyra.js veyra.html veyra.css scripts tests package.json package-lock.json .github/workflows/test.yml
      - run: npm ci
      - name: Baseline gates
        run: npm run check && npm test
      - name: Independent composition probes
        run: node verification/m8-c3-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-c3-independent-results
          path: |
            verification/m8-c3-review.mjs
            verification/m8-c3-review-results.json
          retention-days: 7
