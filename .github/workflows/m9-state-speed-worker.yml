name: M9 state speed worker
on:
  push:
    branches: ['work/m9-state-speed']
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize and apply M9 state speed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-m9-state-speed.py')
          p.write_text(p.read_text().replace('\n""\n)\n', '\n"""\n)\n'))
          PY
          set +e
          python3 scripts/apply-m9-state-speed.py > /tmp/m9-state-speed-patch.log 2>&1
          status=$?
          cat /tmp/m9-state-speed-patch.log
          if [ "$status" -ne 0 ]; then
            mkdir -p verification
            cp /tmp/m9-state-speed-patch.log verification/m9-state-speed-patch-failure.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add verification/m9-state-speed-patch-failure.log
            git commit -m 'test(m9): retain state-speed patch failure evidence'
            git push origin HEAD:work/m9-state-speed
            exit "$status"
          fi
      - name: Syntax check
        run: npm run check
      - name: Full repository suites
        run: npm test
      - name: Remove worker-only machinery
        run: rm -f scripts/apply-m9-state-speed.py .github/workflows/m9-state-speed-worker.yml verification/m9-state-speed-patch-failure.log
      - name: Diff hygiene
        run: git diff --check
      - name: Commit clean M9 state speed slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(m9): add state playback speed reverse and graph metadata'
          git push origin HEAD:work/m9-state-speed
