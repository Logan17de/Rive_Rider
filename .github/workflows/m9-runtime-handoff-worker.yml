name: M9 runtime handoff worker
on:
  push:
    branches: ['work/m9-layered-runtime']
permissions:
  contents: write
jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Refresh M9 milestone progress
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('milestone.md')
          t=p.read_text()
          t=t.replace('**Status:** `READY`','**Status:** `IN PROGRESS`',1)
          replacements={
            '- [ ] Entry pseudo-state;':'- [x] Entry pseudo-state;',
            '- [ ] Exit pseudo-state;':'- [x] Exit pseudo-state;',
            '- [ ] Any state;':'- [x] Any state;',
            '- [ ] Single Animation state;':'- [x] Single Animation state;',
            '- [ ] state speed, including reverse playback;':'- [x] state speed, including reverse playback;',
            '- [ ] state captions and graph/editor metadata;':'- [x] state captions and graph/editor metadata;',
            '- [ ] every enabled layer has independent current state, clock and transition state;':'- [x] every enabled layer has independent current state, clock and transition state;',
            '- [ ] layers evaluate simultaneously in deterministic order;':'- [x] layers evaluate simultaneously in deterministic order;',
            '- [ ] property priority/composition is machine-readable and tested;':'- [x] property priority/composition is machine-readable and tested;',
            '- [ ] disabled layers perform no active runtime work and contribute no ownership;':'- [x] disabled layers perform no active runtime work and contribute no ownership;',
            '- [ ] deterministic fixed-step/elapsed-time stepping;':'- [x] deterministic fixed-step/elapsed-time stepping;',
            '- [ ] current states for every layer;':'- [x] current states for every layer;',
            '- [ ] transition progress and interpolation;':'- [x] transition progress and interpolation;',
            '- [ ] state speed/reverse playback;':'- [x] state speed/reverse playback;',
            '- [ ] observation/fork/read paths do not advance the live machine or consume live events;':'- [x] observation/fork/read paths do not advance the live machine or consume live events;',
          }
          for old,new in replacements.items():
            if old not in t: raise SystemExit(f'missing milestone marker: {old}')
            t=t.replace(old,new,1)
          anchor='## Task 4 — Rive-class transition contract\n'
          evidence='''## M9 implementation evidence — layered runtime slice\n\n- Production candidate tree implements concurrent ordered layer runtimes over the canonical `machineLayer` schema.\n- Compatibility getters (`stateId`, `stateTime`, `transition`) remain adapters over the stable `compatibilityLayer`; reordering layers cannot silently retarget legacy callers.\n- Entry/Exit/Any pseudo states, animation state speed (including reverse), state captions/graph metadata, deterministic later-layer property priority and layered ownership evidence are covered by `tests/veyra-m9-layered-runtime.test.mjs`.\n- Disabled layers are skipped and contribute no ownership; runtime work counters distinguish active/inactive layer work and reset with runtime reset so deterministic scrub/replay remains comparable.\n- Worker Actions run `34810074334`, job `103869484723`: syntax checks PASS, **48/48 suites PASS**, diff hygiene PASS.\n- Capability honesty: Blend state families remain **not exposed** until their evaluator/authoring contracts are implemented. M9 remains IN PROGRESS.\n\n'''
          if anchor not in t: raise SystemExit('task 4 anchor missing')
          t=t.replace(anchor,evidence+anchor,1)
          p.write_text(t)
          PY
      - name: Remove temporary handoff workflow
        run: rm .github/workflows/m9-runtime-handoff-worker.yml
      - name: Commit clean handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(m9): record layered runtime implementation progress'
          git push origin HEAD:work/m9-layered-runtime
