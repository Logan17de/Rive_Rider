name: M9 data condition worker
on:
  push:
    branches: ['work/m9-data-condition-sources']
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare patch bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-m9-data-condition-sources.py')
          text=p.read_text()
          old="""if text.count(needle) != 2:
              raise SystemExit(f'expected stats field block twice, found {text.count(needle)}')
          text = text.replace(needle, replacement)
          """
          new="""if text.count(needle) != 1:
              raise SystemExit(f'expected stats field block once, found {text.count(needle)}')
          text = text.replace(needle, replacement, 1)
          """
          if old not in text: raise SystemExit('stats patch bootstrap target missing')
          p.write_text(text.replace(old,new,1))
          PY
      - run: python3 scripts/apply-m9-data-condition-sources.py
      - name: Preserve compatibility contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          state=Path('src/veyra/stateMachine.js')
          text=state.read_text()
          old="""      transitionConditionEvaluations: 0,
                timelineEvaluations: 0,
          """
          new="""      transitionConditionEvaluations: 0,
                dataConditionReads: 0,
                timelineEvaluations: 0,
          """
          if text.count(old)!=1: raise SystemExit(f'reset stats target count {text.count(old)}')
          state.write_text(text.replace(old,new,1))

          data=Path('src/veyra/dataGraph.js')
          text=data.read_text()
          old="return this.#dataEndpointValue(this.#document(), endpoint, scopeKey(options.scopePath), new Map(), null, null);"
          new="return this.#dataEndpointValue(endpoint, scopeKey(options.scopePath), new Map(), null, null);"
          if text.count(old)!=1: raise SystemExit('getEndpointValue call target missing')
          data.write_text(text.replace(old,new,1))

          model=Path('src/veyra/model.js')
          text=model.read_text()
          old="throw new TypeError(`condition.value or condition.compare is required for operator ${op}.`);"
          new="throw new TypeError(`condition.value is required for operator ${op} when condition.compare is absent.`);"
          if text.count(old)!=1: raise SystemExit('creator validation wording target missing')
          model.write_text(text.replace(old,new,1))
          PY
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/veyra/model.js src/veyra/dataGraph.js src/veyra/stateMachine.js tests/veyra-m9-data-condition-sources.test.mjs
          git commit -m 'feat(m9): drive transitions from View Model data sources'
          git push origin HEAD:work/m9-data-condition-sources
