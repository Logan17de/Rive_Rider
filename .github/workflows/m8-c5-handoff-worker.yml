name: M8 C5 handoff worker
on:
  push:
    branches: ['work/m8-c5-effective-writes']
permissions:
  contents: write
jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Record M8-C5 implementation handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('milestone.md')
          t=p.read_text()
          replacements={
            '## Progress snapshot — refreshed after independent M8-C4 verification':'## Progress snapshot — refreshed after M8-C5 implementation handoff',
            "These are carry-forward approximate planning estimates, not measured vendor-parity scores, line-count metrics or test-pass percentages. C4's seven reproduced regressions now pass independently. Two remaining runtime integration families prevent acceptance of M8 as a whole; no new overall verified-completion increment is claimed.":"These are carry-forward approximate planning estimates, not measured vendor-parity scores, line-count metrics or test-pass percentages. M8-C5 now has a worker implementation with clean full-suite evidence for both remaining runtime integration families. Independent acceptance is still required, so no new overall verified-completion increment is claimed.",
            '| AI-native identity / semantics / control architecture | **~94–96%** | Previously accepted M0–M7 foundation. C3 and covered C4 fixes pass; the two-way runtime write must agree with effective read/graph identity. |':'| AI-native identity / semantics / control architecture | **~94–96%** | Previously accepted M0–M7 foundation. C3/C4 remain green; the C5 worker now resolves reverse writes from the effective scoped graph, pending independent verification. |',
            '| Core editor / engine foundation | **~93–95%** | Previously accepted foundation; all 45 existing suites remain green. Invalid visual binding output still needs safe frame isolation. |':'| Core editor / engine foundation | **~93–95%** | Previously accepted foundation; the C5 worker passes all 46 current suites and isolates invalid visual binding output before scene publication, pending independent verification. |',
            '- Current implementation work: **M8-C5 — READY**, below.':'- Current implementation work: **M8-C5 — AWAITING VERIFICATION**, below.',
            '**Implementation status:** `READY`':'**Implementation status:** `AWAITING VERIFICATION`',
          }
          for old,new in replacements.items():
            if old not in t: raise SystemExit(f'missing milestone marker: {old[:80]}')
            t=t.replace(old,new,1)
          old='''Handoff\n- Status: AWAITING VERIFICATION\n- Implementation commits:\n- Final clean main SHA / exact standard Tests run:\n- Five verifier failures -> permanent test mapping:\n- Effective two-way terminal / pending retarget / Component-scope proof:\n- Event/notification/history non-mutation during resolution proof:\n- Canonical ordinary-property value validation proof:\n- Invalid-branch isolation / event delivery / valid replacement proof:\n- Preview/dispatch/converter failure consistency proof:\n- All prior suites / syntax checks:\n- Actual validation/resolution/output work and size impact:\n- Cleanup / compatibility / browser-acceptance limitations:\n'''
          new='''Handoff\n- Status: AWAITING VERIFICATION\n- Implementation commit: `3011838ad931d8f3bae1e18e4765e20d61a64c0e` on the clean worker tree; promotion is intentionally squash-based so temporary transport history does not enter main.\n- Worker CI evidence: Actions run `34797443968`, job `103833181034` — syntax/contract checks PASS, all 46 discovered suites PASS, diff hygiene PASS. Exact-main standard Tests must still run after promotion.\n- Five verifier failures -> permanent test mapping: `tests/veyra-m8-c5-effective-writes.test.mjs` covers derived-terminal reverse writes, immediate scoped retargets, invalid scalar output/event delivery, invalid converter color isolation/recovery, geometry bounds, and safe preview/dispatch evaluation; prior C4 positive controls remain in normal discovery.\n- Effective two-way terminal / pending retarget / Component-scope proof: reverse mutation settles the same scoped binding graph on a fork, reads the binding's effective resolved source, validates that effective endpoint, then mutates only that scoped terminal. The regression changes A from child2 to child3 and writes immediately before any render/read while B remains isolated.\n- Event/notification/history non-mutation during resolution proof: endpoint discovery runs on a forked runtime, so live event queues/caches/work counters are not advanced merely to choose the terminal; authored serialization/revision/history stay unchanged by runtime-only edits.\n- Canonical ordinary-property value validation proof: canonical finite/bounded/integer/color primitives are shared with document normalization through `src/veyra/propertyValueContract.js`; ordinary binding outputs are value-validated before override publication without cloning/normalizing the whole project per binding.\n- Invalid-branch isolation / event delivery / valid replacement proof: opacity 2, invalid converter color and polygon sides 2 are diagnosed/suppressed; independent output and the valid trigger-bearing scene still return; valid replacement recovers. Published nullable converter sentinels remain unrewritten for C3 compatibility.\n- Preview/dispatch/converter failure consistency proof: an accepted runtime-dependent graph can no longer leave canonical evaluation crashable; bad runtime outputs become structured binding diagnostics. Invalid converter branches are isolated by the same ordinary-property contract.\n- All prior suites / syntax checks: PASS on the clean worker tree in run `34797443968`; C1/C2/C3/C4 and M0-M7 suites remained green.\n- Actual validation/resolution/output work and size impact: reverse-write endpoint discovery performs one private forked graph settle per two-way mutation, not per settled frame; ordinary output validation is targeted per produced property and shares scalar primitives with authored normalization. No new steady-frame polling or project-wide clone was added.\n- Cleanup / compatibility / browser-acceptance limitations: temporary worker scripts/workflows/failure logs were removed from the promoted tree. Existing nullable list-converter publication semantics are preserved. This is Node/runtime/control-plane coverage; real-browser visual/usability acceptance remains separate.\n'''
          if old not in t: raise SystemExit('missing handoff block')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Remove handoff transport workflow
        run: rm .github/workflows/m8-c5-handoff-worker.yml
      - name: Commit clean handoff tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(m8-c5): record implementation handoff awaiting verification'
          git push origin HEAD:work/m8-c5-effective-writes
