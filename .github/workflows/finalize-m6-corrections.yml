name: Finalize M6 Corrections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-m6-final-goldens.py'
      - '.github/workflows/finalize-m6-corrections.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair integration script
        run: python3 scripts/fix-m6-final-integration.py
      - name: Apply focused M6 corrections
        run: python3 scripts/apply-m6-final-corrections.py
      - name: Update authored-stroke goldens
        run: python3 scripts/fix-m6-final-goldens.py
      - name: Syntax check
        run: npm run check
      - name: Run test suites
        run: npm test
      - name: Commit clean M6 correction implementation
        run: |
          rm scripts/apply-m6-final-corrections.py
          rm scripts/fix-m6-final-integration.py
          rm scripts/fix-m6-final-goldens.py
          rm .github/workflows/apply-m6-final-corrections.yml
          rm .github/workflows/repair-m6-final-corrections.yml
          rm .github/workflows/finalize-m6-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix M6 workspace stroke and nested runtime scope [m6-final-corrected]'
          git push
