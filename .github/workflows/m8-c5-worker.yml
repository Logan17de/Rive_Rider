name: M8 C5 worker patch
on:
  push:
    branches: ['work/m8-c5-effective-writes']
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply M8-C5 production patch
        run: python3 scripts/apply-m8-c5-patch.py
      - name: Remove worker-only patch machinery
        run: rm scripts/apply-m8-c5-patch.py .github/workflows/m8-c5-worker.yml
      - name: Syntax and contract checks
        run: npm run check
      - name: Full repository suites
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified M8-C5 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(m8-c5): resolve effective reverse writes and isolate unsafe visual outputs'
          git push origin HEAD:work/m8-c5-effective-writes
