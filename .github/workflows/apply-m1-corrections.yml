name: Apply M1 Corrections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-m1-corrections.yml'
      - 'scripts/apply-m1-corrections.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    if: ${{ !contains(github.event.head_commit.message, '[m1-corrected]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply correction patch
        run: python3 scripts/apply-m1-corrections.py
      - name: Run checks
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Commit verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veyra tests milestone.md
          git diff --cached --check
          git commit -m "Implement M1 correction pass [m1-corrected]"
          git push origin HEAD:main
