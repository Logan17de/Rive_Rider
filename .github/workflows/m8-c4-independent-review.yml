name: M8 C4 independent review
on:
  push:
    branches: ['verify/m8-c4-b57b390']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm unchanged production baseline
        run: |
          git diff --exit-code b57b390b245b363f9024349d9b116996eb045e7a HEAD -- . ':!verification' ':!.github/workflows/m8-c4-independent-review.yml'
          test "$(git rev-parse b57b390b245b363f9024349d9b116996eb045e7a^{tree})" = 0987af4e7c36aa367af320e862ea4ed8b85218dc
      - run: npm ci
      - name: Baseline syntax and full suites
        run: npm run check && npm test
      - name: Independent runtime and public-host probes
        run: node verification/m8-c4-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-c4-independent-results
          path: |
            verification/m8-c4-review.mjs
            verification/m8-c4-review-results.json
          retention-days: 7
