name: Record M5 Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-m5-handoff.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update milestone handoff
        run: python3 scripts/update-m5-handoff.py
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Commit clean handoff
        run: |
          rm scripts/update-m5-handoff.py
          rm .github/workflows/record-m5-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete M5 workspace UX handoff [m5-handoff]'
          git push
