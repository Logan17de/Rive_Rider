name: Apply M5 Workspace UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-m5-workspace.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply M5 workspace integration
        run: |
          python3 scripts/apply-m5-workspace.py
          python3 scripts/fix-m5-workspace.py
          python3 scripts/add-m5-tests.py
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Commit clean M5 implementation
        run: |
          rm scripts/apply-m5-workspace.py
          rm scripts/fix-m5-workspace.py
          rm scripts/add-m5-tests.py
          rm .github/workflows/apply-m5-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement M5 workspace UX stabilization [m5-applied]'
          git push
