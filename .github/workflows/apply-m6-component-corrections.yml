name: Apply M6 Component Corrections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-m6-component-corrections.py'
      - 'scripts/fix-m6-component-correction-fixture.py'
      - '.github/workflows/apply-m6-component-corrections.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused M6 corrections
        run: python3 scripts/apply-m6-component-corrections.py
      - name: Repair adversarial fixture
        run: python3 scripts/fix-m6-component-correction-fixture.py
      - name: Syntax check
        run: npm run check
      - name: Test
        shell: bash
        run: |
          set +e
          npm test > /tmp/m6-corrections.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo '--- M6 CORRECTION FAILURES ---'
            grep -n -E '^(FAIL |.*AssertionError|.*TypeError|.*ReferenceError|.*SyntaxError|.*ERR_)' /tmp/m6-corrections.log | head -160 || true
            echo '--- FAILURE CONTEXT ---'
            grep -n -B3 -A18 -E '^FAIL ' /tmp/m6-corrections.log | head -420 || true
            echo '--- TAIL ---'
            tail -100 /tmp/m6-corrections.log
          else
            tail -70 /tmp/m6-corrections.log
          fi
          exit "$code"
      - name: Commit clean M6 correction implementation
        run: |
          rm scripts/apply-m6-component-corrections.py
          rm scripts/fix-m6-component-correction-fixture.py
          rm .github/workflows/apply-m6-component-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct M6 Component runtime and rig evaluation [m6-corrected]'
          git push
