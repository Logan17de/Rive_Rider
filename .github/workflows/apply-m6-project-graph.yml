name: Apply M6 Project Graph

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-m6-core-anchor.py'
      - 'scripts/apply-m6-core.py'
      - 'scripts/apply-m6-control.py'
      - 'scripts/apply-m6-ai-surface.py'
      - 'scripts/apply-m6-browser.py'
      - '.github/workflows/apply-m6-project-graph.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair staging anchor
        run: python3 scripts/fix-m6-core-anchor.py
      - name: Apply M6 core
        run: python3 scripts/apply-m6-core.py
      - name: Apply M6 control surfaces
        run: python3 scripts/apply-m6-control.py
      - name: Apply M6 AI surfaces
        run: python3 scripts/apply-m6-ai-surface.py
      - name: Apply M6 browser integration
        run: python3 scripts/apply-m6-browser.py
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Commit clean M6 implementation
        run: |
          rm scripts/fix-m6-core-anchor.py scripts/apply-m6-core.py scripts/apply-m6-control.py scripts/apply-m6-ai-surface.py scripts/apply-m6-browser.py
          rm .github/workflows/apply-m6-project-graph.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement M6 multi-artboard Components project graph [m6-applied]'
          git push
