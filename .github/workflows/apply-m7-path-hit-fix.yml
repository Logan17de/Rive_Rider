name: Apply M7 Canonical Path Hit Fix

on:
  push:
    paths:
      - '.github/workflows/apply-m7-path-hit-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply live M7 safety patch
        run: python scripts/apply-m7-live-safety-fix.py
      - name: Apply canonical path hit-test fix
        run: python scripts/apply-m7-canonical-path-hit-fix.py
      - name: Correct rounded-path hit-test fixture
        run: python scripts/apply-m7-hit-test-fixture-fix.py
      - name: Syntax gate
        run: npm run check
      - name: Full test battery
        run: npm test
      - name: Commit clean correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply-m7-live-safety-fix.py scripts/apply-m7-canonical-path-hit-fix.py scripts/apply-m7-hit-test-fixture-fix.py
          git rm -f .github/workflows/apply-m7-path-hit-fix.yml
          git add src/veyra/editorAuthoring.js src/veyra/geometry.js src/veyra/hitTest.js tests/veyra-m7-authoring.test.mjs
          git commit -m "Fix M7 final path safety and hit-test parity [m7]"
          git push origin HEAD:main
