name: M9 trigger consumption v2
on:
  push:
    branches: ['work/m9-trigger-consumption-v2']
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/apply-m9-trigger-consumption-v2.py
      - run: npm run check
      - run: npm test
      - run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/veyra/dataGraph.js src/veyra/stateMachine.js tests/veyra-m9-data-condition-sources.test.mjs tests/veyra-m9-trigger-consumption.test.mjs
          git commit -m 'feat(m9): consume queued data triggers on selected transitions'
          git push origin HEAD:work/m9-trigger-consumption-v2
