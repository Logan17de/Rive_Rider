name: Apply M5 Camera Artboard Corrections

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-m5-camera-artboard-corrections.py'
      - '.github/workflows/apply-m5-camera-artboard-corrections.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused M5 corrections
        run: python3 scripts/apply-m5-camera-artboard-corrections.py
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Commit clean correction implementation
        run: |
          rm scripts/apply-m5-camera-artboard-corrections.py
          rm .github/workflows/apply-m5-camera-artboard-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix M5 stable camera and artboard border resizing [m5-correction]'
          git push
