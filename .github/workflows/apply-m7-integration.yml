name: Apply M7 Integration

on:
  push:
    paths:
      - '.github/workflows/apply-m7-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply M7 core
        run: python scripts/apply-m7-core.py

      - name: Apply M7 renderer and editor UI
        run: python scripts/apply-m7-ui.py

      - name: Apply M7 shell integration
        run: python scripts/apply-m7-shell.py

      - name: Apply M7 safety corrections
        run: python scripts/apply-m7-safety-fixes.py

      - name: Syntax gate
        run: npm run check

      - name: Full test battery
        run: npm test

      - name: Commit clean M7 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-m7-core.py scripts/apply-m7-ui.py scripts/apply-m7-shell.py scripts/apply-m7-safety-fixes.py
          git rm .github/workflows/apply-m7-integration.yml
          git add src/veyra/model.js src/veyra/capabilities.js src/veyra/geometry.js src/veyra/store.js src/veyra/commands.js src/veyra/controlPlane.js src/veyra/serviceRegistry.js src/veyra/renderer.js src/index.js veyra.js veyra.html veyra.css tests/veyra-m7-authoring.test.mjs
          git commit -m "Implement M7 vector authoring and grouping [m7]"
          git push origin HEAD:main
