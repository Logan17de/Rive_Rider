name: M9 blend handoff worker
on:
  push:
    branches: ['work/m9-blend-states']
permissions:
  contents: write
jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Record partial blend implementation evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('milestone.md')
          t=p.read_text()
          anchor='## Task 3 — Ordered simultaneous layer evaluation\n'
          evidence='''### M9 blend-state implementation evidence — partial Task 2 advance\n\n- `blend1d` steady-state evaluation is implemented with stable `machineBlendChild` identity, strictly increasing thresholds, numeric machine-input control, deterministic neighboring-child interpolation, boundary clamping and zero-unused-child work.\n- `directBlend` steady-state evaluation is implemented with stable child identity, numeric per-child input weights, deterministic normalized ownership weights and zero-weight child sleeping.\n- Ownership evidence exposes every active child timeline, its stable blend-child ref and effective normalized weight.\n- Invalid thresholds, missing timelines, duplicate child IDs and non-number legacy inputs fail closed during canonical normalization.\n- Blend transitions are deliberately rejected until the richer transition compositor is implemented; Additive Blend, M8/View Model blend sources and canonical blend-child CRUD commands remain open. Therefore the full Task 2 blend checkboxes remain unchecked.\n- Worker Actions run `34810521222`, job `103870774356`: syntax PASS, **49/49 suites PASS**, diff hygiene PASS.\n\n'''
          if anchor not in t: raise SystemExit('Task 3 anchor missing')
          t=t.replace(anchor,evidence+anchor,1)
          p.write_text(t)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/m9-blend-handoff-worker.yml
      - name: Commit clean progress handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(m9): record partial blend-state implementation progress'
          git push origin HEAD:work/m9-blend-states
