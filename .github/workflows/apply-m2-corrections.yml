name: Apply M2 Corrections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-m2-corrections.yml'
      - 'scripts/apply-m2-corrections.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    if: ${{ !contains(github.event.head_commit.message, '[m2-corrected]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply M2 corrections
        run: |
          python3 scripts/apply-m2-corrections.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/veyra-resolver-corrections.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  const result = resolveSemantic(document, { kinds: ['node'], type: 'ellipse' });"
          new = "  const result = resolveSemantic(document, { kinds: ['node'], type: 'ellipse' }, { minConfidence: 0 });"
          if old not in text:
              raise RuntimeError('symmetric ambiguity test line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run checks
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Commit verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veyra/resolver.js tests/veyra-resolver-corrections.test.mjs milestone.md
          git diff --cached --check
          git commit -m "Implement M2 resolver correctness corrections [m2-corrected]"
          git push origin HEAD:main
