name: M8 Handoff Main

on:
  push:
    branches: [m8-data-binding]
    paths: ['.github/workflows/m8-handoff-main.yml']

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require exact implementation head
        run: test "$(git rev-parse HEAD)" = "f772ba7c571c4e12d04df5750ef0bdfedec458cd"
      - name: Record M8 handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('milestone.md')
          text = p.read_text()
          text = text.replace('- **Current implementation M8 maps to `plan.md` M3 — View Models & Data Binding: READY.**', '- **Current implementation M8 maps to `plan.md` M3 — View Models & Data Binding: AWAITING VERIFICATION.**', 1)
          text = text.replace('**Status:** `READY`', '**Status:** `AWAITING VERIFICATION`', 1)
          start = text.index('## Handoff\n\n```text\nHandoff\n')
          end = text.index('\n```', start) + 4
          block = '''## Handoff

```text
Handoff
- Status: AWAITING VERIFICATION
- Implementation commits: f772ba7c571c4e12d04df5750ef0bdfedec458cd — Implement M8 View Models and data binding [m8]
- Changed files: 22 production/test files; new src/veyra/dataGraph.js and src/veyra/dataStore.js plus canonical model/ref/property/evaluator/control-plane/resolver/dependency/manifest/summary/store/browser integration.
- Tests added/changed: tests/veyra-m8-data-binding.test.mjs (28 adversarial checks) plus additive M6 project-graph, manifest and model gates.
- npm test: 37/37 suites PASS on the exact implementation tree before commit/push.
- npm run check: 43/43 source files PASS on the exact implementation tree before commit/push.
- Identity/migration proof: M8 persistent families use immutable typed refs/IDs; v6 is emitted only for data-bearing projects while data-free historical projects remain canonical v5 and v1–v6 stay readable.
- View Model/property-type proof: number, boolean, trigger, string, enum, color, nested viewModel, list, image and artboard properties normalize/validate through one DOM-free data graph.
- Runtime instance/isolation proof: live values, trigger queues, runtime lists, subscriptions and dirty caches live only in VeyraDataRuntime; authored instance initial values remain distinct.
- Binding/evaluator proof: canonical order is authored -> animation -> playback -> data-binding -> constraints -> interactive; one-way and legal two-way paths use typed endpoints/property addresses and converter chains.
- Ownership/dependency proof: resolver/index, dependency graph, getOwnership/read surfaces expose data -> binding -> target/controller evidence through the existing canonical control plane.
- Cycle/conflict proof: direct/multi-hop binding cycles fail normalization atomically; competing target bindings use higher priority then lexicographically lower stable binding ID.
- Property Group proof: artboard-local groups/properties are first-class typed entities and keyable through the existing property-address/timeline system.
- Enum/converter proof: enum and enumValue identities survive rename/reorder; converter chains are typed/ordered stable refs and invalid composition fails closed.
- List proof: authored list/listItem identity supports insert/update/remove/move with undo/redo; runtime list mutation is scope-local ephemeral state with bounded notification/dirty propagation.
- Component data-isolation proof: Component evaluation passes the full instance runtime path into the same data runtime; sibling/repeated instances can hold different live values without changing source defaults.
- UI/command/manifest parity proof: bounded human authoring exists for View Models/properties/instances/bindings/enums/converters/Property Groups/lists/runtime preview; persistent helpers route through the canonical command dispatcher. Catalog is 35 persistent M8 mutations plus 3 explicit runtime-only data affordances.
- Name-independence proof: routing, binding paths, nested values, enum values, lists and Component data scopes use stable refs/IDs; display names remain advisory.
- Persistence/history proof: runtime data never serializes into .veyra or Store history; persistent M8 CRUD is transactional/undoable and dependency-bound deletions fail closed, including live View Model-instance binding dependents.
- Lightweight/performance impact: zero bindings take an O(1) fast path without graph construction; indexes are cached; a 220-binding adversarial fixture recomputes only the dirty reachable branch; core data engine has no DOM/heavy framework dependency.
- Existing M0–M7 regression proof: all prior suites stayed green inside the 37/37 full gate, including 22/22 M7 adversarial checks.
- GitHub Tests final-head proof: standard .github/workflows/test.yml exact-final-head run is required after this handoff commit; do not treat M8 as VERIFIED until that run and independent verification succeed.
- Progress snapshot update: verified-only percentages intentionally remain unchanged from M7 until independent M8 acceptance.
- Suggestions added to `suggestions`: none; broader unrelated roadmap work was not started.
- Known limitations: M8 defines runtime/data contracts, bounded authoring and list-rendering data semantics only; responsive Layout, layered visual state-machine UI, arbitrary script converters and later runtime/interop milestones remain explicit non-goals.
```'''
          p.write_text(text[:start] + block + text[end:])
          PY
      - name: Commit handoff
        run: |
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add milestone.md
          git commit -m "Complete M8 implementation handoff [m8-handoff]"
          git push origin HEAD:main
