name: M8 Handoff Main

on:
  push:
    branches:
      - m8-data-binding
    paths:
      - '.github/workflows/m8-handoff-main.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require exact implementation head
        run: test "$(git rev-parse HEAD)" = "f772ba7c571c4e12d04df5750ef0bdfedec458cd"
      - name: Fetch handoff writer
        run: git show origin/m8-data-binding:scripts/record-m8-handoff.py > /tmp/record-m8-handoff.py
      - name: Record handoff
        run: python /tmp/record-m8-handoff.py
      - name: Commit handoff
        run: |
          git config user.name "Logesh"
          git config user.email "loganlogesh17@gmail.com"
          git add milestone.md
          git commit -m "Complete M8 implementation handoff [m8-handoff]"
          git push origin HEAD:main
