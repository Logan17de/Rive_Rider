name: Record M4 Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-m4-handoff.yml'
      - 'scripts/record-m4-handoff.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Record handoff
        run: python3 scripts/record-m4-handoff.py
      - name: Syntax check
        run: npm run check
      - name: Test
        run: npm test
      - name: Commit clean handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/record-m4-handoff.yml scripts/record-m4-handoff.py
          git add milestone.md
          git diff --cached --check
          git commit -m "Complete M4 implementation handoff [m4-handoff]"
          git push origin HEAD:main
