name: M9 transition docs refresh
on:
  push:
    branches: ['work/m9-transition-doc-refresh']
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - run: python3 scripts/apply-m9-transition-doc-refresh.py
      - name: Remove transport
        run: rm scripts/apply-m9-transition-doc-refresh.py .github/workflows/m9-transition-doc-refresh.yml
      - name: Check diff
        run: |
          git diff --check
          git diff --exit-code -- src/ ':!milestone.md'
      - name: Commit clean milestone refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(m9): record transition compositor and exit-time progress'
          git push origin HEAD:work/m9-transition-doc-refresh
